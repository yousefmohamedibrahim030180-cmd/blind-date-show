<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blind Date Show — Controller</title><style>
:root{--bg:#f6f1ed;--surface:#fffaf7;--text:#20191a;--muted:#786d6d;--line:#e5d9d4;--red:#b63b4a;--shadow:0 25px 70px rgba(60,35,35,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}body.dark{--bg:#171314;--surface:#241d1e;--text:#fff8f5;--muted:#b9aaaa;--line:#3a3031}
button,input,textarea{font:inherit}button{cursor:pointer}.topbar{height:76px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.12em}.brand span{font-weight:400}.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:40px;height:40px}
main{min-height:calc(100vh - 76px)}.screen{display:none;min-height:calc(100vh - 76px);padding:5vh 5vw}.screen.active{display:block}.hero{max-width:1050px;margin:auto;padding-top:7vh}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:800;color:var(--red);margin:0 0 10px}h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(48px,8vw,92px);line-height:.98;margin:0 0 22px}h1 em{color:var(--red);font-style:italic}.lead{max-width:600px;color:var(--muted);font-size:18px;line-height:1.6}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.entry-card{max-width:480px;padding:28px;margin-top:38px}.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:24px}.tab{flex:1;border:0;background:none;padding:13px;color:var(--muted);font-weight:700;font-size:12px}.tab.active{color:var(--text);border-bottom:2px solid var(--red)}label{display:block;font-size:12px;font-weight:700;margin:14px 0 7px}input,textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:transparent;color:var(--text);padding:13px;outline:none}.primary,.secondary,.danger{border-radius:13px;padding:14px 18px;font-weight:800;margin-top:16px}.primary{border:0;background:var(--red);color:white}.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}.danger{border:0;background:#321f22;color:#fff}.hidden{display:none!important}
.show-grid{max-width:1250px;margin:auto;display:grid;grid-template-columns:1fr 1fr 360px;gap:18px}.video-card{position:relative;background:#171314;border-radius:22px;overflow:hidden;min-height:300px;color:white}.video-card video{width:100%;height:100%;min-height:300px;object-fit:cover;display:block}.video-label{position:absolute;z-index:2;top:15px;left:15px;font-size:10px;letter-spacing:.15em}.video-placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#b9aaaa}.controls{position:absolute;z-index:3;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.controls button{border:0;border-radius:999px;padding:11px 15px;background:#fff}.controls .danger{margin:0;background:#9e3342;color:#fff}.status{position:absolute;bottom:15px;left:15px;font-size:11px}
.chat{grid-row:span 2;padding:18px;display:flex;flex-direction:column;min-height:620px}.room-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}.room-head strong{display:block;font-size:22px;letter-spacing:.12em}.room-head button{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 8px}.messages{flex:1;overflow:auto;padding:15px 0}.msg{margin:10px 0}.msg.me{text-align:right}.bubble{display:inline-block;max-width:90%;padding:9px 12px;border-radius:13px;background:var(--bg);margin-top:4px}.msg strong{font-size:11px}.msg time{font-size:9px;color:var(--muted);display:block;margin-top:3px}.typing{font-size:10px;color:var(--muted);min-height:18px}.chat-input{display:flex;gap:8px}.chat-input button{border:0;border-radius:10px;background:var(--red);color:#fff;padding:0 12px;font-weight:700}
.stage-card{grid-column:span 2;padding:25px}.progress{height:4px;background:var(--line);border-radius:5px;overflow:hidden}.progress div{height:100%;background:var(--red);width:0}.stage-meta{display:flex;justify-content:space-between;margin-top:18px;font-size:11px;letter-spacing:.08em}.stage-meta strong{font-size:22px;letter-spacing:0}.stage-card h2{font:500 31px Georgia,serif;margin:18px 0}.answer-area textarea{min-height:100px}.answer-area p,.final-card p{color:var(--muted);font-size:12px}.final-card{max-width:700px;margin:10vh auto;padding:50px;text-align:center}.final-card h1{font-size:clamp(46px,7vw,76px)}.choices{display:flex;justify-content:center;gap:12px}.choices button{min-width:150px}.result-icon{font-size:70px;color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(8,5,6,.76);backdrop-filter:blur(14px);z-index:50;display:grid;place-items:center;padding:20px}.modal.hidden{display:none}.modalcard{width:min(520px,100%);background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 35px 100px #0008;text-align:center}.modalicon{font-size:42px}.modalcard h2{font:600 34px Georgia,serif;margin:8px 0 12px}.modalcard>p:not(.eyebrow){color:var(--muted);line-height:1.6}.modalcard small{display:block;color:var(--muted);font-size:10px;margin-top:14px}.stars{display:flex;justify-content:center;gap:7px;margin:22px 0}.stars button{border:0;background:transparent;color:#aaa;font-size:42px;padding:0 3px}.stars button.selected,.stars button:hover{color:var(--red)}.ratingcard textarea{height:75px;resize:none}.ratingcard #ratingStatus{font-size:11px;color:var(--muted);min-height:18px}#toast{position:fixed;z-index:80;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;background:#20191a;color:white;padding:11px 16px;border-radius:10px;transition:.2s;pointer-events:none;font-size:12px}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.show-grid{grid-template-columns:1fr}.chat{grid-row:auto;min-height:400px}.stage-card{grid-column:auto}.video-card,.video-card video{min-height:240px}}
.control-link{color:var(--text);text-decoration:none;font-size:12px;font-weight:800;border:1px solid var(--line);padding:9px 12px;border-radius:10px}.control-wrap{max-width:900px;margin:auto;padding:3vh 0}.control-title{font-size:clamp(46px,7vw,78px)}.control-card{padding:26px;margin:18px 0}.control-card h2{font:600 30px Georgia,serif;margin:5px 0 12px}.control-card p:not(.eyebrow){color:var(--muted);line-height:1.5}.control-row{display:flex;gap:12px;align-items:center;justify-content:space-between}.control-row>*{margin-top:0}.control-card select{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--text);padding:13px;margin-top:8px}.control-card textarea{min-height:150px;resize:vertical}.control-card .control-row select{width:180px}.control-card .primary{white-space:nowrap}.stars span{font-size:42px;color:var(--red);display:inline-block;padding:0 2px}.system{opacity:.8}.system .bubble{font-size:11px}
@media(max-width:600px){.screen{padding:28px 16px}.topbar{height:64px;padding:0 16px}.brand{font-size:12px}.control-row{align-items:stretch;flex-direction:column}.control-card .control-row select{width:100%}.control-card .primary,.control-card .secondary{width:100%}.video-card,.video-card video{min-height:220px}.chat{min-height:380px}.stage-card{padding:20px}.stage-card h2{font-size:25px}.controls button{padding:10px 12px}.controls{width:calc(100% - 20px);justify-content:center}.final-card{padding:32px 20px}.choices{flex-direction:column}.choices button{width:100%}}

</style></head><body>
<header class="topbar"><div class="brand">BLIND DATE <span>SHOW · CONTROL</span></div><a class="control-link" href="/">BACK TO SHOW</a></header>
<main><section class="screen active"><div class="control-wrap">
<p class="eyebrow">HOST CONTROL</p><h1 class="control-title">Run the room.<br><em>Ask the question.</em></h1>
<div id="loginCard" class="card control-card"><h2>Controller access</h2><p>Enter the controller key to open the host controls.</p><input id="key" type="password" placeholder="Controller key"><button id="login" class="primary">CONNECT →</button><p id="loginStatus"></p></div>
<div id="panel" class="hidden"><div class="card control-card"><div class="control-row"><div><span class="eyebrow">ROOM</span><h2>Choose a live room</h2></div><button id="refresh" class="secondary">REFRESH</button></div><select id="roomSelect"><option value="">Select a room…</option></select><p id="roomStatus"></p></div>
<div class="card control-card"><p class="eyebrow">LIVE QUESTION</p><h2>Send the question to both people</h2><textarea id="questionInput" maxlength="500" placeholder="Type the question they should see. Sending it starts the selected round."></textarea><div class="control-row"><select id="stageSelect"><option value="0">Round 1</option><option value="1">Round 2</option><option value="2">Round 3</option><option value="3">Round 4</option><option value="4">Round 5</option></select><button id="sendQuestion" class="primary">SEND TO BOTH →</button></div><p id="questionStatus"></p></div></div>
</div></section></main><div id="toast"></div><script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-database-compat.js"></script><script src="/firebase-config.js"></script><script src="/control.js"></script></body></html>
