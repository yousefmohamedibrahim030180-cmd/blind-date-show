name: Import v23 production bundle

on:
  workflow_dispatch:
  push:
    paths:
      - "v23.payload.*"
      - "v23.trigger"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble and validate v23 bundle
        run: |
          cat v23.payload.aa v23.payload.ab v23.payload.ac v23.payload.ad v23.payload.ae v23.payload.af v23.payload.ag v23.payload.ah v23.payload.ai > v23.bundle.b64
          base64 -d v23.bundle.b64 > v23.zip
          unzip -t v23.zip

      - name: Replace repository with v23
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name v23.zip ! -name v23.bundle.b64 ! -name 'v23.payload.*' ! -name v23.trigger -exec rm -rf {} +
          unzip -oq v23.zip
          rm -f v23.zip v23.bundle.b64 v23.payload.aa v23.payload.ab v23.payload.ac v23.payload.ad v23.payload.ae v23.payload.af v23.payload.ag v23.payload.ah v23.payload.ai v23.trigger
          rm -f .github/workflows/import-v23.yml

      - name: Commit v23 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Deploy Blind Date Show v23 [skip ci]"
          git push
