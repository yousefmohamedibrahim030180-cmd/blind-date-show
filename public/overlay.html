<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blind Date Overlay</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Inter,Arial,sans-serif;color:#fff}.wrap{position:absolute;left:5%;bottom:7%;opacity:0;transform:translateY(18px);transition:.35s}.wrap.show{opacity:1;transform:none}.line{border-left:5px solid #ff4f73;padding:9px 18px;background:linear-gradient(90deg,#050507ee,#05050799,transparent);min-width:430px}.title{font:800 34px/1.05 Georgia,serif;text-transform:uppercase;letter-spacing:.02em}.sub{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#ddd;margin-top:7px}.live{position:absolute;top:5%;right:4%;font-size:11px;letter-spacing:.18em;font-weight:900;color:#fff;background:#050507bb;padding:8px 11px;border-radius:99px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff4f73;box-shadow:0 0 14px #ff4f73;margin-right:7px}</style></head><body><div class="live"><span class="dot"></span>ON AIR</div><div id="wrap" class="wrap"><div class="line"><div id="title" class="title"></div><div id="sub" class="sub"></div></div></div><script src="/socket.io/socket.io.js"></script><script>const s=io({transports:['websocket','polling'],reconnection:true}),w=document.getElementById('wrap'),t=document.getElementById('title'),u=document.getElementById('sub');s.on('director:overlay',o=>{t.textContent=o?.title||'';u.textContent=o?.subtitle||'';w.classList.toggle('show',o?.visible!==false&&!!(o?.title||o?.subtitle))});</script></body></html>
